name: Android APK
on:
  pull_request:
    paths: ["android/**", "core/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "core/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" && echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: curl -fsSLo "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip && unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" && echo "GRADLE_HOME=$RUNNER_TEMP/gradle-8.7" >> "$GITHUB_ENV" && echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build-rust.sh
      - working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - run: apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: pocketforge-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error}
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" && echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: curl -fsSLo "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip && unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" && echo "GRADLE_HOME=$RUNNER_TEMP/gradle-8.7" >> "$GITHUB_ENV" && echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build-rust.sh
      - env: {KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"}
        run: umask 077; echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - env:
          KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
          ORG_GRADLE_PROJECT_releaseStoreFile: "${{ runner.temp }}/release.jks"
          ORG_GRADLE_PROJECT_releaseStorePassword: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ORG_GRADLE_PROJECT_releaseKeyAlias: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ORG_GRADLE_PROJECT_releaseKeyPassword: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: test -n "$KEYSTORE_PASSWORD" && cd android && ./gradlew --no-daemon assembleRelease
      - run: apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: {subject-path: android/app/build/outputs/apk/release/app-release.apk}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: pocketforge-release-apk, path: android/app/build/outputs/apk/release/app-release.apk, if-no-files-found: error}
