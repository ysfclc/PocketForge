name: Android release signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build and sign approved Android release
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android platform and NDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.7"

      - name: Compile Rust libraries for Android
        run: ./scripts/build-rust.sh

      - name: Materialize release keystore for this job only
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          unset KEYSTORE_B64

      - name: Assemble signed release APK
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          test -n "$ORG_GRADLE_PROJECT_releaseStorePassword"
          test -n "$ORG_GRADLE_PROJECT_releaseKeyAlias"
          test -n "$ORG_GRADLE_PROJECT_releaseKeyPassword"
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify release APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Remove release keystore material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Generate release SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75
        with:
          path: .
          format: cyclonedx-json
          output-file: pocketforge-release.cdx.json

      - name: Attest release APK provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocketforge-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            pocketforge-release.cdx.json
          if-no-files-found: error
          retention-days: 90
