name: Supply chain security

on:
  pull_request:
  push:
    branches: [main, governance/mission-execution-invariants-2026-11-20]

permissions:
  contents: read

jobs:
  static:
    name: Action, repository and Rust dependency policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust toolchain for security tools
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.88.0"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate GitHub Actions workflow syntax and expressions
        run: '"$HOME/go/bin/actionlint" -color'

      - name: Verify repository foundation and delivery contracts
        run: bash ./scripts/verify-foundation.sh

      - name: Install pinned Cargo security scanners
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.23.0 --locked

      - name: Check dependency licenses, sources and bans
        working-directory: core
        run: cargo deny check

      - name: Audit locked Rust dependencies for known advisories
        working-directory: core
        run: cargo audit

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    name: Review dependency changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
