name: Rust core
on:
  pull_request:
    paths: ["core/**", "scripts/build-rust.sh", ".github/workflows/rust.yml"]
  push:
    branches: [main]
    paths: ["core/**", "scripts/build-rust.sh", ".github/workflows/rust.yml"]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.82.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "ndk;27.2.12479018" && echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
      - run: ./scripts/build-rust.sh
      - working-directory: core
        run: cargo test --workspace --locked && cargo clippy --workspace --all-targets -- -D warnings
