name: PocketForge CI pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketforge-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify Rust core and assemble Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout this exact repository commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Java 17 for Android Gradle
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install required Android platform and NDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install and cache Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.7"

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: pocketforge-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            pocketforge-${{ runner.os }}-

      - name: Verify repository foundation and contracts
        run: ./scripts/verify-foundation.sh

      - name: Compile Rust core for all supported Android ABIs
        run: ./scripts/build-rust.sh

      - name: Run Rust tests and lint checks
        working-directory: core
        run: |
          cargo +1.82.0 test --workspace --locked
          cargo +1.82.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Assemble Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package metadata
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75
        with:
          path: .
          format: cyclonedx-json
          output-file: pocketforge.cdx.json

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocketforge-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            pocketforge.cdx.json
          if-no-files-found: error
          retention-days: 30
